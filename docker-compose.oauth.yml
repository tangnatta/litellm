services:
  litellm:
    build:
      context: .
      target: runtime
    image: tangnatta/litellm-oauth:local
    command: ["--config=/app/oauth-config.yaml", "--port", "4000"]
    ports:
      - "${LITELLM_PORT:-4000}:4000"
    environment:
      DATABASE_URL: postgresql://llmproxy:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env.oauth}@db:5432/litellm
      STORE_MODEL_IN_DB: "True"
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY:?Set LITELLM_MASTER_KEY in .env.oauth}
      LITELLM_SALT_KEY: ${LITELLM_SALT_KEY:?Set LITELLM_SALT_KEY in .env.oauth}
      LITELLM_PUBLIC_URL: ${LITELLM_PUBLIC_URL:-http://localhost:4000}
      ANTIGRAVITY_OAUTH_CLIENT_ID: ${ANTIGRAVITY_OAUTH_CLIENT_ID:?Set ANTIGRAVITY_OAUTH_CLIENT_ID in .env.oauth}
      ANTIGRAVITY_OAUTH_CLIENT_SECRET: ${ANTIGRAVITY_OAUTH_CLIENT_SECRET:?Set ANTIGRAVITY_OAUTH_CLIENT_SECRET in .env.oauth}
      ANTIGRAVITY_AUTH_DIR: /var/lib/litellm/oauth/antigravity
      CHATGPT_TOKEN_DIR: /var/lib/litellm/oauth/chatgpt
    volumes:
      - ./docker/oauth-config.yaml:/app/oauth-config.yaml:ro
      - oauth_credentials:/var/lib/litellm/oauth
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import urllib.request; urllib.request.urlopen('http://localhost:4000/health/liveliness')\""]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  db:
    image: postgres:16
    environment:
      POSTGRES_DB: litellm
      POSTGRES_USER: llmproxy
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env.oauth}
    volumes:
      - oauth_postgres:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -d litellm -U llmproxy"]
      interval: 2s
      timeout: 5s
      retries: 20

volumes:
  oauth_credentials:
  oauth_postgres:
